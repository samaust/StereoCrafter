[build-system]
requires = ["setuptools>=61", "setuptools-scm[simple]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "stereocrafter"
description = "A framework to convert any 2D videos to immersive stereoscopic 3D"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "accelerate",
    "depthcrafter@git+https://github.com/samaust/DepthCrafter@python_package",
    "diffusers>=0.38",
    "forward_warp@git+https://github.com/samaust/Forward-Warp@python_package",
    "ftfy",
    "numpy",
    "peft",
    "pillow",
    "safetensors",
    "torch",
    "transformers>=5.9",
]

[project.optional-dependencies]
demo = [
    "av",
    "decord",
    "fire",
    "imageio",
    "imageio-ffmpeg",
    "opencv-python",
]
dev = [
    "build",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["stereocrafter*"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[project.urls]
Repository = "https://github.com/samaust/StereoCrafter"
