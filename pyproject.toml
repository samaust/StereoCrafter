[build-system]
requires = ["setuptools>=61", "setuptools-scm[simple]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "stereocrafter"
description = "A framework to convert any 2D videos to immersive stereoscopic 3D"
dynamic = ["version"]
dependencies = [
    "depthcrafter@git+https://github.com/samaust/DepthCrafter@python_package",
    "diffusers",
    "forward_warp@git+https://github.com/samaust/Forward-Warp@python_package",
    "numpy",
    "torch",
    "transformers"
]

[project.optional-dependencies]
demo = [
    "decord",
    "fire",
    "opencv-python",
    "torchvision<0.24",
]

[tool.setuptools.packages.find]
include = ["stereocrafter*"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[project.urls]
Repository = "https://github.com/samaust/StereoCrafter"
